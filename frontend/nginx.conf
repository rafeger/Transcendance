
ssl_session_cache   shared:SSL:10m;
ssl_session_timeout 10m;
map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }
server {
        listen 80;
        #listen [::]:80; #ecoute sur ipv6
        return 301 https://$host:8443$request_uri;  # Redirect all HTTP requests to HTTPS
    }
server {
        listen 443 ssl;
        #listen [::]:443 ssl; #ecoute sur ipv6
        keepalive_timeout   75s;
        root /usr/share/nginx/html;

        ssl_certificate     /etc/nginx/cert.pem;
        ssl_certificate_key /etc/nginx/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        location = /index.html {
            add_header Cache-Control no-cache;
        }
        location /assets/ {
            try_files $uri 404;
            add_header Cache-Control "max-age=31536000, immutable, public";
        }
        location / {
            index index.html;
            try_files $uri /index.html;
        }

        location /api/ {
            proxy_pass http://backend:3000;  # Forward requests to the backend
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # transmet l'adresse IP du client au serveur backend, pour que celui-ci sache qui fait la requête. Utile pour les logs, et pour limiter les abus (ex: 10 requêtes par minute par IP).
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /socket.io/ {
            proxy_pass http://backend:3000;  # Forward WebSocket requests to the backend
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; # transmet l'adresse IP du client au serveur backend, pour que celui-ci sache qui fait la requête. Utile pour les logs, et pour limiter les abus (ex: 10 requêtes par minute par IP).
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 120s; # timeout for reading a response from the proxied server. set only between two successive read operations, not for the transmission of the whole response
            proxy_set_header Cookie $http_cookie;
        }
}
