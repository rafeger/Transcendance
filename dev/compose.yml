services:
  db:
    image: docker.io/library/postgres:16-alpine
    env_file:
      - ../.env
    volumes:
      - dbdata:/var/lib/postgresql/data
    networks:
      - transnet-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d postgres"]
      interval: 5s
      timeout: 2m
      retries: 5
      start_period: 30s
  backend:
    build: ../backend
    env_file:
      - ../.env
    depends_on:
      db:
        condition: service_healthy
    init: true
    networks:
      - transnet-dev
    healthcheck: 
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api || exit 1"]
      interval: 5s
      timeout: 2m
      retries: 5
      start_period: 30s
  frontend:
    build: { context: ../frontend, target: build }
    command: npm run dev -- --host 
    volumes:
      - ../frontend/src:/app/src:Z
    init: true
    networks:
      - transnet-dev
    ports:
      - 127.0.0.1:5173:5173
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5173 || exit 1"]
      interval: 5s
      timeout: 2m
      retries: 5
      start_period: 30s
volumes:
  dbdata:
networks:
  transnet-dev:
    driver: bridge