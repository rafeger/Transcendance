services:
  db:
    image: docker.io/library/postgres:16-alpine
    env_file:
      - ../.env
    volumes:
      - dbdata:/var/lib/postgresql/data
    networks:
      - transnet-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 30s
      retries: 5
      start_period: 30s
  backend:
    build: { context: ../backend, target: dev }
    volumes:
      - ../backend/src:/app/src:Z
      - ../backend/prisma:/app/prisma:Z
    env_file:
      - ../.env
    depends_on:
      db:
        condition: service_healthy
    init: true
    networks:
      - transnet-dev
    healthcheck: 
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 30s
      retries: 5
      start_period: 30s
  frontend:
    build: { context: ../frontend, target: dev }
    command: npm run dev -- --host 
    volumes:
      - ../frontend/src:/app/src:Z
    init: true
    networks:
      - transnet-dev
    ports:
      - 127.0.0.1:5173:5173
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:5173 || exit 1"]
      interval: 5s
      timeout: 30s
      retries: 5
      start_period: 30s
volumes:
  dbdata:
networks:
  transnet-dev:
    driver: bridge