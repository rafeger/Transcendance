services:
  web:
    build: ./web
    ports:
      - "8443:443"
    
  db:
    image: docker.io/library/postgres:16-alpine
    env_file:
      - ../.env
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d postgres"]
      interval: 30s
      timeout: 2m
      retries: 5
      start_period: 30s
volumes:
  dbdata:
