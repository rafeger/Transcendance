services:
  web:
    build: ./web
    ports:
      - "8443:443"
  db:
    image: docker.io/library/postgres:16-alpine
    env_file:
      - .env
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d postgres"]
      interval: 5s
      timeout: 2m
      retries: 5
      start_period: 30s
  backend:
    build: ./backend
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    healthcheck: 
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api || exit 1"]
      interval: 5s
      timeout: 2m
      retries: 5
      start_period: 30s
volumes:
  dbdata:
