services:
  frontend:
    build: ./frontend
    init: true
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8443:443"
    networks:
      - transnet
  db:
    image: docker.io/library/postgres:16-alpine
    env_file:
      - .env
    volumes:
      - dbdata:/var/lib/postgresql/data
    networks:
      - transnet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 20s
      retries: 5
      start_period: 30s
  backend:
    build: ./backend
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    init: true
    networks:
      - transnet
    healthcheck: 
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 20s
      retries: 5
      start_period: 30s
volumes:
  dbdata:
networks:
  transnet:
    driver: bridge
